  <style>
    /* Portrait first: header, clock and links stack in one column. Landscape splits them into side columns around the clock. Newer units sit after an older fallback so browsers that do not know them keep the line before. */
    [hidden] {
      display: none !important;
    }

    body {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 8px 16px;
      padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: "Francois One", sans-serif;
      background-color: white;
    }

    #side-left,
    #side-right {
      align-self: stretch;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "Yeseva One", sans-serif;
      font-size: 2em;
      line-height: 1.1;
      color: #FF3300;
    }

    h1 span {
      color: #3266CC;
    }

    #subtitle {
      margin: 0;
    }

    #key {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      font-size: .8em;
    }

    #key li {
      display: inline-block;
      margin: 0 6px 4px;
      white-space: nowrap;
    }

    .swatch {
      display: inline-block;
      width: 1.2em;
      height: 1.2em;
      margin-right: 4px;
      vertical-align: -.3em;
    }

    /* Reserves room for everything else in the column so the page fits without scrolling. */
    #clock {
      position: relative;
      flex: none;
      width: 92vmin;
      width: min(100vw - 32px, 100vh - 10rem);
      width: min(100vw - 32px, 100dvh - 10rem);
      margin: 8px 0;
    }

    #clock::before {
      content: "";
      display: block;
      padding-top: 100%;
    }

    #clockface,
    #hand {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #clock.unknown #hand {
      display: none;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    /* Centered on the clock's (0,0), which the clockface viewBox places at these fractions of its width and height. */
    #toggle {
      position: absolute;
      left: calc(100% * 1333.5 / 2600);
      top: calc(100% * 1366.8 / 2600);
      width: 12%;
      height: 12%;
      min-width: 48px;
      min-height: 48px;
      transform: translate(-50%, -50%);
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
    }

    #toggle img {
      display: block;
      width: 100%;
      height: 100%;
    }

    #toggle .pause,
    #toggle.playing .play {
      display: none;
    }

    #toggle.playing .pause {
      display: block;
    }

    #player {
      max-width: 100%;
    }

    #about {
      margin: 0 8px;
    }

    #adsense {
      width: 240px;
      height: 66px;
    }

    @media (orientation: landscape) {
      body {
        flex-direction: row;
        align-items: stretch;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #side-left,
      #side-right {
        flex: 1 1 0%;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #side-left {
        align-items: flex-start;
        padding: 8px 16px 0 24px;
        text-align: left;
      }
      #side-right {
        justify-content: flex-end;
        align-items: flex-end;
        padding: 0 16px 8px;
        text-align: right;
      }
      h1 {
        font-size: 3em;
      }
      #key li {
        display: block;
        margin: 0 0 4px;
      }
      #clock {
        align-self: center;
        width: 92vmin;
        width: min(100vh - 16px, 100vw - 22rem);
        width: min(100dvh - 16px, 100vw - 22rem);
        margin: 0;
      }
      #controls {
        justify-content: flex-end;
      }
      #adsense {
        position: fixed;
        bottom: 6px;
        left: 6px;
      }
    }

    @media (orientation: landscape) and (max-height: 499px) {
      h1 {
        font-size: 2em;
      }
    }

    @media (max-width: 719px), (max-height: 499px) {
      #adsense {
        display: none;
      }
    }

    /* Portrait screens wide enough to show the ad at the bottom. */
    @media (orientation: portrait) and (min-width: 720px) and (min-height: 500px) {
      #clock {
        width: min(100vw - 32px, 100vh - 10rem - 74px);
        width: min(100vw - 32px, 100dvh - 10rem - 74px);
      }
    }
  </style>

<body>
  <div id="side-left">
    <header id="logo">
      <h1>NPR <span>Today</span></h1>
      <p id="subtitle">An hourly NPR News clock</p>
    </header>
    <ul id="key">
      <li><span class="swatch" style="background-color:#C0C0C2;"></span>Segment</li>
      <li><span class="swatch" style="background-color:#231F20;"></span>Newscast</li>
      <li><span class="swatch" style="background-color:#7EB3D2;"></span>Promo</li>
      <li><span class="swatch" style="background-color:#73A1AD;"></span>Music Bed</li>
      <li><span class="swatch" style="background-color:#EE2A2C;"></span>Funding Credit</li>
    </ul>
  </div>
  <div id="clock">
    <img id="clockface" width="2600" height="2600">
    <!-- Must share the viewBox of every clockface in img/. The hand pivot and the #toggle position both assume it. -->
    <svg id="hand" viewBox="-1333.5 -1366.8 2600 2600" aria-hidden="true">
      <line id="minuteHand" y2="-1007" stroke="red" stroke-width="8" />
    </svg>
    <button id="toggle" type="button" aria-label="Play" hidden>
      <img class="play" src="img/play.png" alt="">
      <img class="pause" src="img/pause.png" alt="">
    </button>
  </div>
  <div id="side-right">
    <div id="controls">
      <audio id="player" src="https://npr-ice.streamguys1.com/live.mp3" autoplay controls>
        Please <a href="https://browsehappy.com/" target="_blank">update your browser</a> to a modern browser in order to play audio
      </audio>
      <div id="about">
        <a class="github-button" href="https://github.com/leoherzog/nprtoday" data-icon="octicon-star" aria-label="Star leoherzog/nprtoday on GitHub">Star</a>
      </div>
    </div>
  </div>
  <div id="adsense">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9544720367752359" crossorigin="anonymous"></script>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9544720367752359" data-ad-slot="1053510704" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
</body>
